name: Bug report
description: Report a defect in tai-distribution (container image, Compose bundle, release CI)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or commands that reproduce the problem (docker run, compose up, etc.).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Distribution version / image tag
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you are running it (docker / compose), the platform arch, and versions (Docker, Compose) as relevant.
      placeholder: "docker.io/tai42/tai:0.1.1, linux/arm64, Docker 27, Compose 2.29"
    validations:
      required: true
