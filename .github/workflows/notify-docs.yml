# Docs regeneration hook.
#
# On every push to `main` this fires a `repository_dispatch` at the org's
# tai-docs repo, which triggers the `regenerate` job in tai-docs' docs.yml.
# tai-docs consumes this repository as a source: its generators derive the
# self-host reference (compose/helm defaults, the ALWAYS_PUBLIC compose
# comparison) from this repo's `main` HEAD, so a change here must regenerate
# the reference just as a monorepo or Studio change does.
#
# The dispatch needs a `TAI_DOCS_DISPATCH_TOKEN` secret (`contents: write` on
# tai-docs). On the canonical tai42ai/tai-distribution repo an unset token
# fails the job loudly (the docs reference would otherwise silently go stale).
# A fork has no such secret, so the step is skipped there rather than failing
# the run.

name: notify-docs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.TAI_DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Require the dispatch token on the canonical repo
        if: github.repository == 'tai42ai/tai-distribution' && env.DOCS_DISPATCH_TOKEN == ''
        run: |
          echo "::error::TAI_DOCS_DISPATCH_TOKEN is unset on tai42ai/tai-distribution; the tai-docs regeneration dispatch cannot fire and the self-host reference would silently go stale. Set the TAI_DOCS_DISPATCH_TOKEN secret (contents: write on tai-docs)." >&2
          exit 1
      - name: Trigger the tai-docs regeneration pipeline
        if: env.DOCS_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.DOCS_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/tai-docs
          event-type: source-repo-push
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}"
            }
