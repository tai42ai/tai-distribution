# Release PRs merge themselves the moment branch protection's required checks
# pass — the release train has no human step. The PAT (not GITHUB_TOKEN) must
# both enable auto-merge and author the merge commit: refs written by
# GITHUB_TOKEN fire no workflows, so a GITHUB_TOKEN merge would strand the
# train before its tag ever published.
# Strict branch protection marks an armed bot PR out-of-date on every push to
# main, and nothing else refreshes those branches (release-please only on
# releasable commits; refresh-pins/refresh-studio-ref only on their dispatch),
# so the refresh job re-syncs every armed bot-lane PR on each push.
name: release-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge on the release PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  refresh:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Re-sync armed release PRs against main
        run: |
          set -euo pipefail
          numbers=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq ".[] | select((.head.ref | startswith(\"release-please--\")) or .head.ref == \"refresh-pins\" or .head.ref == \"refresh-studio-ref\") | select(.head.repo.full_name == \"$REPO\") | .number")
          for n in $numbers; do
            if out=$(gh api -X PUT "repos/$REPO/pulls/$n/update-branch" 2>&1); then
              echo "Refreshed PR #$n"
            elif echo "$out" | grep -qi 'no new commits'; then
              echo "PR #$n already up to date"
            else
              echo "Failed to refresh PR #$n: $out" >&2
              exit 1
            fi
          done
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
