name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot's default commit/PR titles are not Conventional Commits; linting
    # them yields a red check that trains people to ignore CI. Its bumps do not
    # need conventional subjects (release-please ignores unparseable commits).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # amannn reads the PR title
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # commitlint walks the PR commit range
      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
