name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot's default commit/PR titles are not Conventional Commits; linting
    # them yields a red check that trains people to ignore CI. Its bumps do not
    # need conventional subjects (release-please ignores unparseable commits).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # amannn reads the PR title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint walks the PR commit range
      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
