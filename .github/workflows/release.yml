name: release

on:
  push:
    tags: ["v*"]

# Minimal by default; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Image-input agreement gate, ahead of every build leg: the pinned
  # tai42-contract version in docker/pypi-requirements.txt must lie inside the
  # contract range the pinned studio commit (docker/STUDIO_REF) declares, else the
  # served SPA speaks a contract the running platform does not; and the e2e suite
  # tag in docker/E2E_REF must be a tai42-e2e release tag the suite repository
  # serves, else the build leg's e2e gate could not check the suite out. A red
  # here starts no build, so nothing is scanned, pushed, signed or released.
  alignment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Pinned contract version is inside the studio's declared range
        env:
          STUDIO_REPO_URL: https://github.com/${{ github.repository_owner }}/tai-studio.git
        run: uv run --python 3.13 --with packaging python scripts/check_image_alignment.py --studio-repo "$STUDIO_REPO_URL"
      - name: Pinned e2e suite tag exists in the suite repository
        env:
          SUITE_REPO_URL: https://github.com/${{ github.repository_owner }}/tai42.git
        run: python3 scripts/check_e2e_ref.py --suite-repo "$SUITE_REPO_URL"

  # Per-arch build on native runners (NOT QEMU), fanned out over the image list:
  # the platform image plus the two pinned session images. Each leg builds its
  # image, scans it, and — only if the scan passes — pushes it to GHCR BY DIGEST
  # (no tag). The platform leg also runs the e2e gate between the scan and the
  # push: the scanned image boots through the shipped compose bundle and the
  # tai42-e2e suite its `ai.tai42.e2e.ref` label names runs against it
  # (.github/actions/e2e-gate), so every published arch carries the tag of a
  # suite that passed on it. The merge job assembles the multi-arch manifest
  # lists from these digests. A bare matrix push to a shared tag would overwrite the tag with a
  # single-arch image, hence split-and-merge.
  #
  # The session images are self-contained (base + pip install / base-only), so
  # they build from their own context with NO SOURCE/STUDIO_REF/E2E_REF
  # build-args; only the platform image carries them.
  build:
    needs: alignment
    strategy:
      fail-fast: false
      matrix:
        image:
          - key: platform
            ghcr: ghcr.io/tai42ai/tai
            context: .
            file: docker/Dockerfile
            platform_build_args: true
          - key: sandbox-claude-code
            ghcr: ghcr.io/tai42ai/tai-sandbox-claude-code
            context: docker/sandbox-images/claude-code
            file: docker/sandbox-images/claude-code/Dockerfile
            platform_build_args: false
          - key: sandbox-exec
            ghcr: ghcr.io/tai42ai/tai-sandbox-exec
            context: docker/sandbox-images/exec
            file: docker/sandbox-images/exec/Dockerfile
            platform_build_args: false
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push per-arch digests to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Read STUDIO_REF
        id: studio
        run: echo "ref=$(cat docker/STUDIO_REF)" >> "$GITHUB_OUTPUT"
      - name: Read E2E_REF
        id: e2e
        run: echo "ref=$(cat docker/E2E_REF)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every image consumes SECURITY_UPDATES_EPOCH (it busts the security-update
      # layer's cache so the scanned-and-pushed image always carries the latest
      # Debian uploads); only the platform image also consumes
      # SOURCE/VERSION/STUDIO_REF/E2E_REF, the session images build from base + pip
      # install. Assemble the build-args once so the two build steps below stay
      # identical across the image list — the shared value also keeps the scanned
      # bits and the pushed bits the same layer.
      - name: Assemble build args
        id: bargs
        env:
          PLATFORM_ARGS: ${{ matrix.image.platform_build_args }}
          VERSION: ${{ steps.ver.outputs.version }}
          STUDIO_REF: ${{ steps.studio.outputs.ref }}
          E2E_REF: ${{ steps.e2e.outputs.ref }}
          SECURITY_UPDATES_EPOCH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            echo "args<<__EOF__"
            echo "SECURITY_UPDATES_EPOCH=${SECURITY_UPDATES_EPOCH}"
            if [[ "${PLATFORM_ARGS}" == "true" ]]; then
              echo "SOURCE=pypi"
              echo "VERSION=${VERSION}"
              echo "STUDIO_REF=${STUDIO_REF}"
              echo "E2E_REF=${E2E_REF}"
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      # Build to the local daemon first so trivy can scan the exact bits BEFORE
      # any push. The gha cache makes the subsequent push build near-free. Cache
      # scope is per image+arch so the three images never share a cache key.
      - name: Build for scan (load)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: tai-scan-${{ matrix.image.key }}:${{ matrix.arch }}
          build-args: ${{ steps.bargs.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image.key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.key }}-${{ matrix.arch }}
      # Gate: fail on FIXABLE critical/high (--ignore-unfixed). The checked-in
      # .trivyignore.yaml carries the scoped exceptions (passed via trivyignores
      # because the YAML ignorefile is not auto-read).
      - name: Trivy scan (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tai-scan-${{ matrix.image.key }}:${{ matrix.arch }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
      # Gate: the tai42-e2e suite the image's label names passes against the
      # scanned image on this arch. The push below rebuilds from the same cache
      # with the same build-args, so the pushed image is the one tested.
      - name: e2e gate (before push)
        if: ${{ matrix.image.platform_build_args }}
        uses: ./.github/actions/e2e-gate
        with:
          image: tai-scan-${{ matrix.image.key }}:${{ matrix.arch }}
          suite-repo-url: https://github.com/${{ github.repository_owner }}/tai42.git
          project-name: e2e-gate-${{ matrix.arch }}
          report-name: e2e-gate-junit-${{ matrix.arch }}
      - name: Build and push by digest to GHCR
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.bargs.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image.key }}-${{ matrix.arch }}
          sbom: true
          provenance: true
          outputs: type=image,name=${{ matrix.image.ghcr }},push-by-digest=true,name-canonical=true,push=true
      # Step outputs reach the shell through env, never by expression
      # interpolation into the script text.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      # One artifact per image+arch; the merge job selects an image's arch
      # digests by the `digest-<image>-*` name pattern.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.key }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Assemble one multi-arch manifest list per semver tag for each image from its
  # per-arch GHCR digests, then cosign-keyless-sign the manifest-list digest in
  # every registry the image publishes to (signatures live in the registry of the
  # signed reference — signing docker.io alone would leave the ghcr mirror
  # unsigned). Fanned out over the same image list as `build`: every image
  # publishes to BOTH registries, Docker Hub primary and GHCR mirror.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - key: platform
            src: ghcr.io/tai42ai/tai
            registries: docker.io/tai42/tai ghcr.io/tai42ai/tai
          - key: sandbox-claude-code
            src: ghcr.io/tai42ai/tai-sandbox-claude-code
            registries: docker.io/tai42/tai-sandbox-claude-code ghcr.io/tai42ai/tai-sandbox-claude-code
          - key: sandbox-exec
            src: ghcr.io/tai42ai/tai-sandbox-exec
            registries: docker.io/tai42/tai-sandbox-exec ghcr.io/tai42ai/tai-sandbox-exec
    permissions:
      contents: read
      packages: write # push manifest lists + signatures to GHCR
      id-token: write # cosign keyless OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.key }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create and push manifest lists
        id: manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SRC_REPO: ${{ matrix.image.src }}
          REGISTRIES: ${{ matrix.image.registries }}
        run: |
          set -euo pipefail
          # Semver fan-out: X.Y.Z / X.Y / X / latest — the moving suffixes are
          # claimed by stable releases only. A prerelease (1.2.0rc1, 1.2.0-rc1)
          # publishes its exact version tag and leaves X.Y / X / latest pointing
          # at the last stable image.
          SUFFIXES=("${VERSION}")
          if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            SUFFIXES+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}" "latest")
          else
            echo "::notice::prerelease ${VERSION}: publishing the version tag only"
          fi
          # Per-arch source manifests, pushed by the build matrix to GHCR.
          SRC=()
          for d in /tmp/digests/*; do
            SRC+=("${SRC_REPO}@sha256:$(basename "${d}")")
          done
          if [[ ${#SRC[@]} -eq 0 ]]; then
            echo "ERROR: no per-arch digests found for ${SRC_REPO}" >&2
            exit 1
          fi
          for REG in ${REGISTRIES}; do
            TAGS=()
            for s in "${SUFFIXES[@]}"; do TAGS+=(-t "${REG}:${s}"); done
            echo "==> imagetools create ${REG} (${SUFFIXES[*]})"
            docker buildx imagetools create "${TAGS[@]}" "${SRC[@]}"
          done
          # Resolve the manifest-list digest in each registry for signing, emitted
          # newline-separated as "<ref>@<digest>".
          {
            echo "signrefs<<__EOF__"
            for REG in ${REGISTRIES}; do
              D="$(docker buildx imagetools inspect "${REG}:${VERSION}" --format '{{ .Manifest.Digest }}')"
              echo "${REG}@${D}"
            done
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign sign manifest lists (keyless)
        env:
          SIGN_REFS: ${{ steps.manifest.outputs.signrefs }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [[ -n "${ref}" ]] || continue
            cosign sign --yes "${ref}"
          done <<< "${SIGN_REFS}"

  # Mirror the two session images' manifest lists to Oracle Cloud's registry
  # (OCIR) when the repository sets the OCIR_IMAGE_PREFIX variable
  # (`<region>.ocir.io/<namespace>/<path>`): the same digest under the same
  # tags as Docker Hub, cosign-keyless-signed in OCIR. The OCIR login is
  # `<OCI_NAMESPACE>/<OCI_USERNAME>` with OCI_AUTH_TOKEN, all three secrets.
  # It runs after `merge`, so a failure here fails this job and leaves the
  # Docker Hub and GHCR images, their signatures and the GitHub Release as
  # they are. Without the variable the job is skipped.
  ocir:
    needs: merge
    if: vars.OCIR_IMAGE_PREFIX != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [tai-sandbox-claude-code, tai-sandbox-exec]
    permissions:
      contents: read
      packages: read # read the released manifest list from GHCR
      id-token: write # cosign keyless OIDC
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the OCIR target
        id: target
        env:
          PREFIX: ${{ vars.OCIR_IMAGE_PREFIX }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          {
            echo "repo=${PREFIX}/${IMAGE}"
            echo "host=${PREFIX%%/*}"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to OCIR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.target.outputs.host }}
          username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}
      - name: Copy the manifest list to OCIR
        id: copy
        env:
          SRC_REPO: ghcr.io/tai42ai/${{ matrix.image }}
          DEST_REPO: ${{ steps.target.outputs.repo }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # The same tag fan-out as the merge job: X.Y.Z / X.Y / X / latest for
          # a stable release, the exact version tag only for a prerelease.
          SUFFIXES=("${VERSION}")
          if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            SUFFIXES+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}" "latest")
          fi
          SRC_DIGEST="$(docker buildx imagetools inspect "${SRC_REPO}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          TAGS=()
          for s in "${SUFFIXES[@]}"; do TAGS+=(-t "${DEST_REPO}:${s}"); done
          echo "==> imagetools create ${DEST_REPO} (${SUFFIXES[*]})"
          docker buildx imagetools create "${TAGS[@]}" "${SRC_REPO}@${SRC_DIGEST}"
          D="$(docker buildx imagetools inspect "${DEST_REPO}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          echo "signref=${DEST_REPO}@${D}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign sign the OCIR manifest list (keyless)
        env:
          SIGN_REF: ${{ steps.copy.outputs.signref }}
        run: cosign sign --yes "${SIGN_REF}"

  # Cut the GitHub Release with generated notes and the image SBOM attached.
  github-release:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release
      packages: read # pull the released image for the SBOM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version plus the stable-vs-prerelease verdict from the same semver shape
      # the merge job's tag fan-out uses, so the GitHub Release is flagged
      # consistently with how the image tags were claimed.
      - name: Derive version from tag
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      # Generate a CycloneDX SBOM of the released multi-arch image to attach to
      # the GitHub Release (in-registry buildx attestations also exist).
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/tai42ai/tai:${{ steps.ver.outputs.version }}
          format: cyclonedx
          output: sbom.cdx.json
      # Marked prerelease on the same verdict that withheld the moving image
      # tags, so a prerelease is never presented as the latest release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.prerelease != 'true' }}
          files: sbom.cdx.json
