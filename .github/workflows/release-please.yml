name: release-please

# Tags exist only for commits whose full `ci` succeeded on main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write # push the release PR branch; create the tag + GitHub Release
      pull-requests: write # open and update the release PR
    steps:
      # The PAT (not GITHUB_TOKEN) is required so the release PR triggers CI and
      # the tag it creates on merge triggers release.yml — refs written by
      # GITHUB_TOKEN do not fire workflows.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
