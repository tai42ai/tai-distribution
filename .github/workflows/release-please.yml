name: release-please

# release-please runs on every push to main and on manual dispatch, opening or
# updating the release-train PR; that PR's own CI is the merge gate. Merging the
# train pushes its merge commit, which re-triggers this workflow to mint the
# tag; release-please is idempotent, so an already-present tag is a no-op. The
# tag lane (release.yml) builds and ships the release images; it fires on the
# tag push, not on this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Release automation runs on the org repo only, never in a fork.
    if: github.repository == 'tai42ai/tai-distribution'
    permissions:
      contents: write # push the release PR branch; create the tag + GitHub Release
      pull-requests: write # open and update the release PR
    steps:
      # The PAT (not GITHUB_TOKEN) is required so the release PR triggers CI and
      # the tag it creates on merge triggers release.yml — refs written by
      # GITHUB_TOKEN do not fire workflows.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
