{{- /*
Built-in engine mTLS material (container mode only). The control API is always
mTLS-authenticated, never a bare endpoint. The engine and the app pods live in
SEPARATE pods, and the engine is granted NO Kubernetes RBAC (it spawns inner dind
containers, not k8s objects), so it cannot publish runtime-generated certs into a
Secret other pods read. The chart therefore mints the mTLS trust at install time:
one CA signs a SERVER bundle (the engine serves the control API with it) and a
CLIENT bundle (serve + backend present it at /certs/client). Both share the CA, so
the server trusts the client and vice versa.

Rotation-safe: a `lookup` reuses the live Secrets on upgrade (annotated
helm.sh/resource-policy: keep) so the CA/certs are not re-minted — the same
generated-credential keep pattern the Postgres/Redis passwords use. External mode
uses the operator's own `external.clientCertSecret` and renders nothing here.

GitOps caveat (identical to the password Secrets): `helm template | kubectl apply`
cannot lookup the live Secret, so the certs are re-minted every render — supply an
external engine + clientCertSecret for GitOps.
*/ -}}
{{- if and .Values.sandbox.enabled (eq .Values.sandbox.provider "docker") (eq .Values.sandbox.engine.mode "builtin") }}
{{- $clientName := include "tai.sandbox.clientCertSecretName" . -}}
{{- $serverName := include "tai.sandbox.serverCertSecretName" . -}}
{{- $existingClient := lookup "v1" "Secret" .Release.Namespace $clientName -}}
{{- $existingServer := lookup "v1" "Secret" .Release.Namespace $serverName -}}
{{- $caPem := "" -}}
{{- $serverCertPem := "" -}}
{{- $serverKeyPem := "" -}}
{{- $clientCertPem := "" -}}
{{- $clientKeyPem := "" -}}
{{- if and $existingClient $existingClient.data $existingServer $existingServer.data (index $existingServer.data "ca.pem") }}
{{- $caPem = index $existingServer.data "ca.pem" | b64dec -}}
{{- $serverCertPem = index $existingServer.data "cert.pem" | b64dec -}}
{{- $serverKeyPem = index $existingServer.data "key.pem" | b64dec -}}
{{- $clientCertPem = index $existingClient.data "cert.pem" | b64dec -}}
{{- $clientKeyPem = index $existingClient.data "key.pem" | b64dec -}}
{{- else }}
{{- $svc := include "tai.sandbox.engineName" . -}}
{{- $altNames := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) -}}
{{- $ca := genCA (printf "%s-sandbox-ca" (include "tai.fullname" .)) 3650 -}}
{{- $server := genSignedCert $svc (list) $altNames 3650 $ca -}}
{{- $client := genSignedCert "sandbox-client" (list) (list) 3650 $ca -}}
{{- $caPem = $ca.Cert -}}
{{- $serverCertPem = $server.Cert -}}
{{- $serverKeyPem = $server.Key -}}
{{- $clientCertPem = $client.Cert -}}
{{- $clientKeyPem = $client.Key -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serverName }}
  labels:
    {{- include "tai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-engine
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.pem: {{ $caPem | b64enc }}
  cert.pem: {{ $serverCertPem | b64enc }}
  key.pem: {{ $serverKeyPem | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientName }}
  labels:
    {{- include "tai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-engine
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.pem: {{ $caPem | b64enc }}
  cert.pem: {{ $clientCertPem | b64enc }}
  key.pem: {{ $clientKeyPem | b64enc }}
{{- end }}
