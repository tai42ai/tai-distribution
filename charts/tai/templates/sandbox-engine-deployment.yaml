{{- /*
Built-in sandbox engine (container mode, engine.mode=builtin). A SEPARATE workload
from the app pods — NOT a sidecar — so the app pods' hardened securityContext
(readOnlyRootFilesystem, drop ALL, non-root) stays untouched. The privilege
rootless-dind needs to create its inner user/net namespaces (SYS_ADMIN, unconfined
seccomp) is isolated to THIS pod; where a sandboxed RuntimeClass (sysbox / gVisor)
is available the operator sets engine.runtimeClassName and can drop SYS_ADMIN.

The engine serves the mTLS control API on :2376 to serve + backend (which reach it
via the ClusterIP Service below and present the chart-generated client certs). It
is granted NO Kubernetes RBAC: it spawns inner dind containers, not k8s objects.
The daemon reads the chart-generated SERVER cert/key/CA explicitly (no auto-gen), so
the cert trust is deterministic at render time. A single-replica, RWO durable PVC
holds the workspace store, so the strategy is Recreate.

Engine posture: the CONTAINER is privileged so rootlesskit can create its nested
user/net namespaces and program the inner bridge (docker's dind-rootless requirement);
the DAEMON still runs ROOTLESS (uid 1000), so inner sessions stay rootless-contained.
Privilege does NOT widen what a session can reach — the network split + egress firewall
below do that. See values.yaml sandbox.engine for the node userns prerequisite.

Inner-session isolation: a session is an inner container of the rootless-dind
daemon, on dind's private inner bridge, NAT'd out through THIS pod's network
namespace — so restricting this pod's egress confines the sessions. TWO layers do
that for builtin: the k8s egress NetworkPolicy (sandbox-networkpolicy.yaml, the
cluster-native layer) AND this pod's own in-pod dind-netns egress firewall — the
CNI-INDEPENDENT backstop, since NetworkPolicy `ipBlock` egress is CNI-dependent.
The firewall programs DOCKER-USER inside dockerd's rootless netns via `nsenter -n`,
which needs root over the rootlesskit child userns — the rootless engine container
(uid 1000) cannot do it. So a PRIVILEGED ROOT SIDECAR (with pod shareProcessNamespace,
so it sees dockerd's pid) installs it, mirroring the compose engine's root entrypoint;
see sandbox-firewall-configmap.yaml.
*/ -}}
{{- if and .Values.sandbox.enabled (eq .Values.sandbox.provider "docker") (eq .Values.sandbox.engine.mode "builtin") }}
{{- if not .Values.sandbox.engine.internalCIDRs }}
{{- fail "sandbox.engine.internalCIDRs is required when sandbox.enabled and engine.mode=builtin — supply the cluster-internal CIDRs the engine's egress NetworkPolicy denies (pod/service/node ranges); shipping an engine whose sessions can reach the whole internal network is refused, not silently defaulted" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tai.sandbox.engineName" . }}
  labels:
    {{- include "tai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-engine
spec:
  # One engine holding a ReadWriteOnce durable store — never two pods on the claim
  # at once, so replace on rollout rather than surging a second mounter.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-engine
  template:
    metadata:
      labels:
        {{- include "tai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-engine
    spec:
      # No RBAC — the engine calls no Kubernetes API.
      automountServiceAccountToken: false
      # Shared PID namespace so the privileged firewall sidecar sees the rootless
      # dockerd process and can `nsenter -n` into its netns to program DOCKER-USER
      # (the engine container is rootless and cannot). Mirrors the compose engine,
      # where a single root entrypoint nsenters into the same-container dockerd.
      shareProcessNamespace: true
      {{- with .Values.sandbox.engine.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.sandbox.engine.podSecurityContext | nindent 8 }}
      containers:
        - name: sandbox-engine
          image: "{{ .Values.sandbox.engine.image.repository }}:{{ .Values.sandbox.engine.image.tag }}"
          imagePullPolicy: {{ .Values.sandbox.engine.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.sandbox.engine.securityContext | nindent 12 }}
          env:
            {{- /* Empty disables the entrypoint's cert auto-generation; the daemon
                   reads the chart-generated server certs via the explicit flags below,
                   so the mTLS trust is deterministic and shares the client bundle's CA. */}}
            - name: DOCKER_TLS_CERTDIR
              value: ""
          {{- /* Just exec the stock rootless entrypoint (rootlesskit + dockerd) with the
                 dockerd args below; $@ carries the args through to dockerd-entrypoint.sh.
                 The egress firewall is NOT installed here — the engine container is rootless
                 (uid 1000) and cannot nsenter into its own rootless netns as root. The
                 privileged root firewall sidecar below installs it instead (via the pod's
                 shared PID namespace), mirroring the compose engine's ROOT entrypoint. */}}
          command:
            - sh
            - -c
            - |
              exec dockerd-entrypoint.sh "$@"
            - sh
          args:
            - --host=tcp://0.0.0.0:2376
            - --tlsverify
            - --tlscacert=/sandbox-server-certs/ca.pem
            - --tlscert=/sandbox-server-certs/cert.pem
            - --tlskey=/sandbox-server-certs/key.pem
          ports:
            - name: dockerd
              containerPort: 2376
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dockerd
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: dockerd
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sandbox.engine.resources | nindent 12 }}
          volumeMounts:
            - name: server-certs
              mountPath: /sandbox-server-certs
              readOnly: true
            {{- /* Rootless dind keeps images/volumes under the rootless user's home,
                   so the durable store mounts at the daemon's data-root there. */}}
            - name: engine-data
              mountPath: {{ .Values.sandbox.engine.dataDir | quote }}
        {{- /* Privileged ROOT egress-firewall sidecar. The engine container is rootless
               (uid 1000) and cannot nsenter into dockerd's rootless netns as root; this
               sidecar runs privileged as uid 0 and — via the pod's shareProcessNamespace —
               sees dockerd's pid, so its `nsenter -n` into the daemon netns works. It runs
               the SAME script the compose engine's root entrypoint runs, installing the
               DOCKER-USER rules before the app dials the control API (the CNI-independent
               backstop to the egress NetworkPolicy). Same image as the engine so nsenter +
               iptables are present. The script fails LOUDLY on any error (isolation is
               load-bearing), so `set -e` propagates a failed install as a non-zero exit —
               the sidecar crash-loops visibly rather than idling with sessions unconfined;
               on success it idles so the container stays Running. */}}
        - name: firewall
          image: "{{ .Values.sandbox.engine.image.repository }}:{{ .Values.sandbox.engine.image.tag }}"
          imagePullPolicy: {{ .Values.sandbox.engine.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.sandbox.engine.firewallSidecarSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              /sandbox-firewall/dind-egress-firewall.sh
              exec sleep infinity
          resources:
            {{- toYaml .Values.sandbox.engine.firewallSidecarResources | nindent 12 }}
          volumeMounts:
            {{- /* In-pod dind egress firewall init, RO — see sandbox-firewall-configmap.yaml. */}}
            - name: firewall
              mountPath: /sandbox-firewall
              readOnly: true
      volumes:
        - name: server-certs
          secret:
            secretName: {{ include "tai.sandbox.serverCertSecretName" . }}
        - name: firewall
          configMap:
            name: {{ include "tai.sandbox.engineName" . }}-firewall
            # Executable: the container command runs the script directly (mirrors the
            # compose mount's execute bit), so dockerd-entrypoint stays untouched.
            defaultMode: 0555
        - name: engine-data
          persistentVolumeClaim:
            claimName: {{ include "tai.sandbox.engineName" . }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tai.sandbox.engineName" . }}
  labels:
    {{- include "tai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-engine
spec:
  type: ClusterIP
  selector:
    {{- include "tai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-engine
  ports:
    - name: dockerd
      port: 2376
      targetPort: dockerd
      protocol: TCP
{{- end }}
