{{- if and .Values.memoryRedis.auth.enabled (not .Values.memoryRedis.auth.existingSecret) .Values.memoryRedis.enabled }}
{{- /*
Install-time random password for the QUICKSTART memory-redis StatefulSet only,
mirroring the core redis pattern but with its OWN Secret — the two legs never
share a credential. Kept across upgrades:
  - helm.sh/resource-policy: keep so a helm uninstall/re-render never deletes it,
  - a lookup of the live Secret reuses the existing password on upgrade so it is
    not rotated (which would break the running Redis and every flow-memory
    connection).
No working default lives in values.yaml — this is the sole source of the
quickstart credential, and the same Secret feeds both the memory-redis
StatefulSet (--requirepass) and the app env (MEMORY_REDIS_PASSWORD) so they
cannot drift. An EXTERNAL memory redis owns its own credentials in
memoryRedis.connString, so the chart never generates one for it.

Caveat for GitOps (`helm template | kubectl apply`): the lookup returns nothing
without a live cluster connection, so every render mints a NEW random password.
For GitOps supply memoryRedis.auth.existingSecret instead of relying on this.
*/}}
{{- $secretName := printf "%s-memory-redis-auth" (include "tai.fullname" .) }}
{{- $key := .Values.memoryRedis.auth.existingSecretKey | default "memory-redis-password" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data $key) }}
{{- $password = index $existing.data $key | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tai.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ $password | quote }}
{{- end }}
