# Parity-render values: every conditionally-emitted pinned pod-env key ON, so the
# k8s tier-2 refusal parity test compares against the FULL pinned env surface (a
# default render would hide keys behind their feature gates). k8s config mode so
# the shape is k8s and the TAI_K8S_* identity keys emit. Both backend.type
# branches are covered by the test rendering this file twice (arq + celery).
config:
  mode: k8s

redis:
  auth:
    enabled: true

memoryRedis:
  enabled: true
  auth:
    enabled: true

features:
  accessControl:
    enabled: true
  versioning:
    enabled: true
  accounts:
    enabled: true
  connectors:
    enabled: true
  marketplace:
    enabled: true

metrics:
  enabled: true

pluginPrefix:
  enabled: true

backend:
  enabled: true
  # Overridden to celery on the second parity render so CELERY_* also appears.
  type: arq
  celery:
    brokerUrl: "amqp://tai:parity@rabbitmq.example.com:5672//"

# Sandbox ON so tai.commonEnv emits BOTH provider connection keys
# (SANDBOX_DOCKER_HOST + SANDBOX_LOCAL_ROOT) into the app pod env. external mode
# avoids standing up the dind engine in a pure `helm template` parity render while
# still emitting both env keys; the client cert Secret is a volume mount, so no cert
# key lands in the pod env.
sandbox:
  enabled: true
  engine:
    mode: external
  external:
    endpoint: "tcp://sandbox-engine.example.com:2376"
    clientCertSecret: "sandbox-client-certs-external"
