# Core TAI self-hosting stack: one minimal-core image run as three
# processes — serve (HTTP + MCP + Studio), backend worker (task backend), and
# metrics (Prometheus multiprocess reader) — over postgres + redis.
#
# Quickstart:
#
#     cp .env.example .env                       # fill in POSTGRES_PASSWORD etc.
#     mkdir -p config
#     cp manifest.example.yml config/manifest.yml
#     touch config/.env                          # app-side env; see .env.example
#     docker compose up -d
#
# `.env` (this directory) holds the deployment's secrets/knobs; Compose reads it
# automatically for ${VAR} substitution below. `config/` is bind-mounted at /app
# and holds the app's `manifest.yml` (the file config provider's input); it may
# also hold an optional `.env` the app loads itself. Both `.env` and `config/`
# are git-ignored so a filled-in deployment can never be committed.
#
# Datastores are NOT host-published — only serve's HTTP port is. Reach postgres
# and redis over the compose network (hostnames `postgres` / `redis`).
#
# Optional profiles (opt in with `--profile <name>`):
#   minio        — MinIO + bucket init for the tai42_storage_s3 provider.
#   celery       — RabbitMQ broker for the celery task backend leg. Switch the
#                  backend by setting TAI_BACKEND_MODULE=tai42_backend_celery in
#                  `.env` (the manifest's !ENV expansion reads it); the celery
#                  wiring below is preset on serve/backend and idle under arq.
#   agents-redis — a module-capable redis:8 (RediSearch + RedisJSON) on its own
#                  service for the langgraph redis checkpoint/store agents leg.

name: tai

# json-file log rotation so a long-running container cannot fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# The minimal-core image, pinned by TAI_VERSION (default `latest`). Built
# locally for dev (SOURCE=local) or pulled from Docker Hub for a release.
x-tai-image: &tai-image "docker.io/tai42/tai:${TAI_VERSION:-latest}"

# Runtime env shared by every app process (serve / backend / metrics). Held in
# one anchor so the three processes can never drift on the connection settings
# they MUST agree on (the worker bus, the task backend, the metrics multiproc
# dir). Datastore hostnames are the fixed compose-network names; the single
# POSTGRES_PASSWORD is the "default" database's password, so a deployment has
# exactly one DB credential to set.
x-tai-app-env: &tai-app-env
  # --- supervision shape marker ------------------------------------------------
  # Pins recycle shape detection to compose so a recycle-class profile diff
  # resolves the compose refusal list, never bare. Set here (not per service) so
  # every app process reports the same shape.
  TAI_SUPERVISED: compose
  # --- config provider (file mode: reads /app/manifest.yml + /app/.env) -------
  TAI_CONFIG_MODE: file
  TAI_CONFIG_DIR_PATH: /app
  TAI_MANIFEST_PATH: /app/manifest.yml
  # Chosen by the manifest's `backend_module: !ENV ${TAI_BACKEND_MODULE:...}`.
  # Default arq; set to tai42_backend_celery in .env for the celery profile.
  TAI_BACKEND_MODULE: "${TAI_BACKEND_MODULE:-tai42_backend_arq}"

  # --- access control ----------------------------------------------------------
  # Passed through from .env. The example .env ships an explicit `false` (the
  # docs' auth-free quickstart shape); if you remove the line there, this falls
  # back to the app's own secure default (`true`) — which then REQUIRES an
  # identity provider lifecycle module in the manifest, or boot refuses loudly
  # (the /health and /ready probes are served public by default). See the
  # access-control guide before enabling.
  ACCESS_CONTROL_ENABLE: "${ACCESS_CONTROL_ENABLE:-true}"
  # Public-regardless-of-table path prefixes. This env REPLACES the app's code
  # default ("/api/login") wholesale, so the default here re-includes /api/login
  # (the login screen's public methods endpoint), the built Studio SPA's static
  # surface — the shell at "/", its hashed /assets and importmap /vendor bundles,
  # and the favicon — so a served-Studio deployment with access control ON can
  # load its login page. The operational probes /health and /ready are NOT listed
  # here: the skeleton serves them public by their own acknowledged route-level
  # declaration (acknowledged_public_routes), so the serve healthcheck and any
  # orchestrator reach them without a key by design. Listing them here would ALSO
  # be rejected at boot — an always-public entry that overlaps an acknowledged
  # public route is a configuration conflict. Everything under /api/* except
  # /api/login stays authed. A headless (no-Studio) deployment can drop the SPA
  # prefixes and keep just /api/login.
  ACCESS_CONTROL_ALWAYS_PUBLIC_PATH_PREFIXES: '${ACCESS_CONTROL_ALWAYS_PUBLIC_PATH_PREFIXES:-["/api/login", "/assets", "/vendor", "/favicon.ico", "/tai42-logo-icon.png", "/apple-touch-icon.png", "/"]}'

  # --- worker bus + MCP session store (BOTH mandatory) ------------------------
  # Multi-worker serve refuses to boot without the bus (siblings would serve
  # stale config after a reload), and a registered task backend refuses to boot
  # without it (the backend-runtime and server processes must converge). The MCP
  # session store is what makes --stateless-http multi-worker coherent.
  TAI_BUS_REDIS_URL: redis://redis:6379/0
  SUB_MCP_REDIS_URL: redis://redis:6379/0

  # --- arq task backend (default) ---------------------------------------------
  ARQ_REDIS_URL: redis://redis:6379/0

  # --- celery task backend (celery profile; idle under arq) -------------------
  # Preset always: a Compose profile cannot mutate another service's env, so the
  # broker wiring lives here and only activates when TAI_BACKEND_MODULE selects
  # celery. The broker is RabbitMQ; results + the RedBeat schedule store ride the
  # core redis. RABBITMQ_PASSWORD is substituted without a required-guard here so
  # the default (profile-less) stack starts without it; the rabbitmq service
  # itself guards it, so bringing up the celery profile unset fails loudly.
  CELERY_BROKER_URL: "amqp://${RABBITMQ_USER:-tai}:${RABBITMQ_PASSWORD:-}@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_REDBEAT_REDIS_URL: redis://redis:6379/0

  # --- other feature redis stores (all on the core redis) ---------------------
  TAI_TOOL_RUNS_REDIS_URL: redis://redis:6379/0
  TAI_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
  INTERACTIONS_REDIS_URL: redis://redis:6379/0
  HOOKS_REDIS_URL: redis://redis:6379/0
  ACCESS_CONTROL_REDIS_URL: redis://redis:6379/0
  CONNECTOR_STORE_REDIS_URL: redis://redis:6379/0

  # --- namespace fallback ------------------------------------------------------
  # Catch-all for every redis consumer without a specific *_REDIS_URL above; the
  # flow engine payload store (FLOW_REDIS_URL) resolves through this fallback.
  TAI_DEFAULT_REDIS_URL: redis://redis:6379/0

  # --- postgres registry: the "default" database -------------------------------
  # Every postgres-backed component binds to the "default" database (the binding
  # is unset, so it resolves to "default"), so one connection block serves them
  # all. The one POSTGRES_PASSWORD is required (no working default) so an
  # unchanged deployment cannot ship a shared credential. db-migrate and `tai
  # doctor` use the same database; the admin (migrator) identity is unset here, so
  # it falls back to this runtime user/password — one identity for both.
  TAI_DATABASE_DEFAULT_PG_HOST: postgres
  TAI_DATABASE_DEFAULT_PG_PORT: "5432"
  TAI_DATABASE_DEFAULT_PG_DB: "${POSTGRES_DB:-tai}"
  TAI_DATABASE_DEFAULT_PG_USER: "${POSTGRES_USER:-tai}"
  TAI_DATABASE_DEFAULT_PG_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"

  # --- Prometheus multiprocess dir (same path, per-writer volume) --------------
  # An absolute path the app makes on boot, mounted over the tai user's home
  # (/home/tai is tai-owned in the image, so a fresh named volume inherits that
  # ownership and the non-root uid-1000 process can write the multiproc files).
  # prometheus_client names its per-process files by PID, and each container has
  # its own PID namespace — so serve's workers and the backend worker WOULD
  # collide on identical filenames if they shared one volume. The path is the
  # same everywhere, but the writers are isolated by volume: serve + metrics
  # share `tai-prometheus` (metrics reads what serve writes); backend rides its
  # own `tai-prometheus-backend` (see the backend service).
  PROMETHEUS_MULTIPROC_DIR: /home/tai/prometheus

  # --- S3 object storage (minio profile; used when the manifest loads it) ------
  # MINIO_ROOT_PASSWORD is substituted without a required-guard here so the
  # default (profile-less) stack starts without it; the minio and minio-init
  # services guard it, so bringing up the minio profile unset fails loudly.
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-tai}"
  STORAGE_S3_ACCESS_KEY: "${MINIO_ROOT_USER:-tai}"
  STORAGE_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-}"
  STORAGE_S3_SECURE: "false"
  STORAGE_S3_REGION: us-east-1

  # --- sandbox providers (optional; sandbox_module selects EXACTLY ONE) --------
  # Two provider connection envs, one per baked sandbox provider, BOTH
  # empty-default so `docker compose config` needs no new required var and an
  # unset key = that provider off (start-time behaviour only, per the
  # minio/rabbitmq unguarded-substitution pattern — never a `${VAR:?}` compose
  # guard, which would also block the default profile-less stack). Both keys
  # COEXIST here even though the scalar manifest `sandbox_module` names exactly
  # one provider at runtime: anchor presence is chart-values scope, so the
  # unselected provider's key stays empty/unused and harmless. Shared by
  # serve/backend/metrics/db-migrate through this one anchor.
  #   SANDBOX_DOCKER_HOST — the sandbox-docker engine control endpoint
  #     (tcp://sandbox-engine:2376, `sandbox` profile). The mTLS client certs
  #     are a fixed RO volume mount at /certs/client, NOT env, so no cert path
  #     ever becomes a recycle-pinned anchor key.
  #   SANDBOX_LOCAL_ROOT  — the sandbox-local host workspace ROOT (direct/host
  #     mode). Persistent workspaces live at <SANDBOX_LOCAL_ROOT>/<workspace_key>,
  #     so it MUST resolve to the provisioned tai-sandbox-local-data volume
  #     (mounted into serve+backend below) for the `persistent` tier to survive.
  SANDBOX_DOCKER_HOST: "${SANDBOX_DOCKER_HOST:-}"
  SANDBOX_LOCAL_ROOT: "${SANDBOX_LOCAL_ROOT:-}"

services:
  # ---- db-migrate: one-shot migration runner -------------------------------
  # Runs the app's pending migrations (ordered chain, each applied once and
  # recorded in tai_schema_history) through the "default" database's admin
  # identity before serve/backend start — their boot gate refuses a database with pending
  # migrations and fails loudly. Exits 0 when the schema is up to date;
  # serve/backend gate on that completion.
  db-migrate:
    image: *tai-image
    logging: *default-logging
    # One-shot migrate on the app image; a memory ceiling and a cpu cap bound a
    # single service so it cannot starve the host (mirrors the chart's app limits).
    mem_limit: 512m
    cpus: 1.0
    command: ["db", "migrate"]
    environment: *tai-app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- serve: HTTP API + MCP + same-origin Studio SPA ----------------------
  serve:
    image: *tai-image
    logging: *default-logging
    restart: unless-stopped
    # Grace before SIGKILL on stop/recycle — >= the serving surface's in-flight
    # drain budget so uvicorn can finish live requests before the kill.
    stop_grace_period: 300s
    # Memory ceiling above the chart's 1Gi single-worker limit because compose
    # serve runs 2 workers; cpu cap bounds the busiest service on a single host.
    mem_limit: 1536m
    cpus: 2.0
    # Explicit multi-worker: serve's own default is 1 worker (silently
    # single-worker without this), and workers>1 on the default stateful http
    # transport is refused at boot unless --stateless-http is set. Bind 0.0.0.0
    # so the published port is reachable from outside the container.
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--stateless-http"]
    environment: *tai-app-env
    volumes:
      - ./config:/app
      - tai-prometheus:/home/tai
      # Sandbox mTLS client certs (RO), shared from sandbox-engine: the
      # sandbox-docker provider reads cert.pem/key.pem/ca.pem from this fixed
      # path (never env). Empty + unused when the `sandbox` profile is off.
      - tai-sandbox-certs:/certs/client:ro
      # Direct/host mode (sandbox-local) persistent workspace ROOT. Persistent
      # workspaces live at <SANDBOX_LOCAL_ROOT>/<workspace_key>, so this MUST be
      # a provisioned volume for the `persistent` tier to survive a container
      # restart — the reciprocal of the engine block-store dependency below.
      # Mutually exclusive with docker mode; unused/empty under sandbox-docker.
      - tai-sandbox-local-data:${SANDBOX_LOCAL_ROOT:-/var/lib/tai-sandbox-local}
    # Default datastore network + the sandbox control path (§ sandbox-ctrl): serve
    # reaches the engine control API for the sync/conversation/SSE session doors.
    networks:
      - default
      - sandbox-ctrl
    ports:
      - "${TAI_SERVE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # Explicit per-service healthcheck (probes serve's own :8000/health via the
    # Python stdlib — the image ships no curl/wget). Generous start_period:
    # boot does manifest-driven dynamic imports with variable startup time, and a
    # start_period of 0 would flap slow boots to unhealthy and break
    # depends_on: service_healthy.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---- backend: the task backend worker (arq default / celery profile) -----
  backend:
    image: *tai-image
    logging: *default-logging
    restart: unless-stopped
    # Grace before SIGKILL on stop/recycle — >= the worker's in-flight job drain
    # budget (arq job_completion_wait / celery warm-drain) so the current job
    # finishes before the kill.
    stop_grace_period: 300s
    # Matches the chart's 1Gi backend limit; cpu cap bounds the worker on a host.
    mem_limit: 1024m
    cpus: 1.5
    command: ["backend", "worker"]
    environment: *tai-app-env
    volumes:
      - ./config:/app
      # Own multiproc volume (NOT the shared tai-prometheus): the backend worker
      # names its Prometheus files by PID in its own PID namespace and would
      # collide with serve's workers on identical filenames if they shared a
      # volume. These backend metrics are NOT scraped in the compose quickstart
      # (the metrics reader below rides serve's volume). In the chart they ARE
      # exposed — the backend pod carries its own metrics sidecar.
      - tai-prometheus-backend:/home/tai
      # Sandbox mTLS client certs (RO), shared from sandbox-engine: the
      # sandbox-docker provider reads cert.pem/key.pem/ca.pem from this fixed
      # path (never env). Empty + unused when the `sandbox` profile is off.
      - tai-sandbox-certs:/certs/client:ro
      # Direct/host mode (sandbox-local) persistent workspace ROOT — same volume
      # serve mounts (both run agent code). MUST be provisioned for the
      # `persistent` tier to survive; mutually exclusive with docker mode.
      - tai-sandbox-local-data:${SANDBOX_LOCAL_ROOT:-/var/lib/tai-sandbox-local}
    # Default datastore network + the sandbox control path (§ sandbox-ctrl): the
    # background-submit door creates sessions on the worker, so backend also
    # reaches the engine control API.
    networks:
      - default
      - sandbox-ctrl
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # The worker has no HTTP listener, so the baked serve probe (:8000/health)
    # would leave it permanently unhealthy. Probe the bus redis instead — the
    # worker is useless without it, and it is present under every backend leg.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['TAI_BUS_REDIS_URL']).ping() else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---- metrics: the standalone Prometheus multiprocess reader --------------
  metrics:
    image: *tai-image
    logging: *default-logging
    restart: unless-stopped
    # Matches the chart's 256Mi metrics-sidecar limit; small cpu cap.
    mem_limit: 256m
    cpus: 0.5
    # backend_metrics_host defaults to 127.0.0.1 (unreachable via the container
    # IP), so bind 0.0.0.0 for cross-container scraping.
    command: ["metrics", "--host", "0.0.0.0", "--port", "8012"]
    environment: *tai-app-env
    volumes:
      - ./config:/app
      # Reads serve's multiproc dir — shares the tai-prometheus volume with serve
      # (the writer). The backend worker writes to its own volume, unscraped here.
      - tai-prometheus:/home/tai
    depends_on:
      redis:
        condition: service_healthy
    # The metrics server DOES listen on HTTP, but on the metrics port — not
    # serve's :8000 — so the baked probe would ride the wrong port. Probe
    # :8012/metrics.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,sys\ntry:\n    sys.exit(0 if urllib.request.urlopen('http://localhost:8012/metrics').status < 500 else 1)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code < 500 else 1)\nexcept OSError:\n    sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---- core datastores -----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    # Matches the chart's 512Mi postgres limit; cpu cap bounds the DB on a host.
    mem_limit: 512m
    cpus: 1.0
    # Creates the `tai` database on first boot (POSTGRES_DB). No working default
    # password — required so an unchanged deployment cannot share a credential.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tai}"
      POSTGRES_DB: "${POSTGRES_DB:-tai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - tai-postgres-data:/var/lib/postgresql/data
    # Not host-published: reached over the compose network only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tai} -d ${POSTGRES_DB:-tai}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    # Matches the chart's 256Mi redis limit; small cpu cap.
    mem_limit: 256m
    cpus: 0.5
    # Internal-only (never host-published), so it runs without auth to keep the
    # connection URLs simple; the app reaches it over the compose network.
    # --appendonly yes for durability parity with the chart's redis: feature
    # stores (rate limits, tool runs, interactions, hooks, …) live here, so the
    # AOF must survive a restart rather than losing everything since the last
    # RDB snapshot.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---- minio profile: S3-compatible object storage for tai42_storage_s3 ------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    # Compose interpolates EVERY service in this file, including ones no active
    # profile selects, so a `${VAR:?}` guard here would also block the default
    # profile-less stack. The credential is therefore substituted unguarded and
    # checked at container start instead: unset means exit non-zero with the
    # reason, never a silent boot on an empty password.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "ERROR: MINIO_ROOT_PASSWORD is not set in .env — required by the minio profile" >&2
          exit 1
        fi
        exec /usr/bin/docker-entrypoint.sh "$$@"
      - sh
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-tai}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - tai-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the STORAGE_S3_BUCKET so the provider has somewhere to write
  # (exits 0 once done; not a long-running service).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["minio"]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-tai}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-tai}"
    # Credential checked at start rather than through a `${VAR:?}` guard: Compose
    # interpolates profile-gated services even when their profile is inactive, so
    # the guard would also block the default stack. Passed via the environment so
    # the secret never lands in the container's argv.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "ERROR: MINIO_ROOT_PASSWORD is not set in .env — required by the minio profile" >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_S3_BUCKET"
    restart: "no"

  # ---- celery profile: the RabbitMQ broker ---------------------------------
  # Adds ONLY the broker; the celery wiring on serve/backend is preset in the
  # shared env above. A custom (non-guest) user works over the compose network
  # without RabbitMQ's loopback-user restriction.
  rabbitmq:
    # tag 4-management-alpine, pinned by digest so the broker base cannot float
    # across a pull. Refresh the digest when moving to a newer rabbitmq 4.x.
    image: rabbitmq:4-management-alpine@sha256:669e803629d3bb9bd77f6c51772a51bfa59a84f9ab194393639980b866613bf2
    profiles: ["celery"]
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-tai}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-}"
    # Credential checked at start rather than through a `${VAR:?}` guard: Compose
    # interpolates profile-gated services even when their profile is inactive, so
    # the guard would also block the default stack. RabbitMQ would otherwise
    # accept an empty RABBITMQ_DEFAULT_PASS and quietly leave the broker without
    # the intended credential.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$RABBITMQ_DEFAULT_PASS" ]; then
          echo "ERROR: RABBITMQ_PASSWORD is not set in .env — required by the celery profile" >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - sh
    command: ["rabbitmq-server"]
    volumes:
      - tai-rabbitmq-data:/var/lib/rabbitmq
      # Permit celery's transient non-exclusive control queues on RabbitMQ 4
      # (denied by default; Queue.declare -> 541). Mounted alongside the image's
      # conf.d defaults, which stay in effect.
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tai.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---- agents-redis profile: module-capable redis for the langgraph leg -----
  # redis:8 bundles RediSearch + RedisJSON, which the plain core redis:7 lacks.
  # Point the agents checkpoint/store config at redis://redis-agents:6379 in your
  # manifest/env to use it. A separate service so it never shares the core
  # redis's state.
  redis-agents:
    # tag 8, pinned by digest so the module-capable base cannot float across a
    # pull. Refresh the digest when moving to a newer redis 8.x.
    image: redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    profiles: ["agents-redis"]
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - tai-redis-agents-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---- sandbox profile: the rootless-dind coding-session engine -------------
  # The sandbox-docker provider's container engine. Off unless `--profile
  # sandbox`. A rootless Docker-in-Docker daemon that runs each agent session as
  # an INNER container on its own private bridge — NEVER on any compose network.
  # It is on `sandbox-ctrl` ONLY (not the default network), so the engine cannot
  # address postgres/redis/minio; serve+backend reach its mTLS control API on
  # tcp://sandbox-engine:2376 over sandbox-ctrl.
  #
  # ISOLATION INVARIANT (README design F.19): a session is an inner container of
  # this daemon, NAT'd out through the engine's netns for internet egress and
  # reachable to NOTHING else of the deployment — not serve, backend, the
  # datastores, nor the control API (it holds no client cert). The network split,
  # the dind egress firewall (below), and mTLS on the control API ENFORCE this
  # deny-by-default; PLAN_5's negative test confirms it.
  #
  # DURABLE BLOCK STORE (reciprocal dependency): PLAN_3 creates/adopts the
  # persistent tai-sbx-<workspace_key> volumes ON this engine; they are docker
  # volumes INSIDE this daemon, so they physically live in its /var/lib/docker
  # tree. Persisting that tree on the tai-sandbox-engine-data named volume is
  # what makes PLAN_3's durability="persistent" tier REAL across an engine
  # recycle — PLAN_3 names the seam, this file owns the block storage it lives
  # on. Ephemeral sessions ride anonymous inner volumes that die with their
  # container (no durable footprint).
  #
  # BUILD-TIME RE-VERIFY (STOP-and-surface, never a privileged fallback): confirm
  # the pinned rootless image can BOTH self-generate the client certs AND program
  # its own inner-bridge firewall on the target host; if it cannot, stop and
  # surface — the sysbox/gVisor runtime is the documented hardening path.
  sandbox-engine:
    # tag 28-dind-rootless, pinned by digest so the engine base cannot float
    # across a pull. Refresh the digest when moving to a newer docker 28.x.
    image: docker:28-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431
    profiles: ["sandbox"]
    logging: *default-logging
    restart: unless-stopped
    # Generous grace so the daemon drains inner sessions cleanly before SIGKILL.
    stop_grace_period: 120s
    # Memory ceiling + cpu cap bound the engine on a single host (the per-service
    # bound convention); size for the concurrent session load you expect.
    mem_limit: 2048m
    cpus: 2.0
    # Documented rootless-dind posture (NOT --privileged): the nested user
    # namespace + inner-bridge iptables need seccomp/apparmor unconfined on the
    # ENGINE container only — the app services keep their posture untouched. If
    # the pinned image needs more than this on your host, STOP and surface (see
    # the header); the sysbox/gVisor runtime is the documented hardening path.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      # dind self-generates the CA + server + CLIENT certs under this dir; the
      # client dir ($DOCKER_TLS_CERTDIR/client) holds cert.pem/key.pem/ca.pem —
      # the three filenames serve+backend consume RO at /certs/client. Byte-for-
      # byte the filenames PLAN_3's provider defaults (tls_cert/key/ca_path).
      DOCKER_TLS_CERTDIR: /certs
    # sandbox-ctrl ONLY — the engine is deliberately off the datastore network.
    networks:
      - sandbox-ctrl
    volumes:
      # Durable block store: the daemon's /var/lib/docker tree (see header).
      - tai-sandbox-engine-data:/var/lib/docker
      # Share ONLY the generated client certs (cert.pem/key.pem/ca.pem) to
      # serve+backend: dind writes them here ($DOCKER_TLS_CERTDIR/client); the CA
      # + server material stays on the engine's own rootfs, never shared. A
      # SESSION never mounts this volume.
      - tai-sandbox-certs:/certs/client
      # Egress firewall init (§ dind egress firewall), RO. Programmed into the
      # inner bridge's DOCKER-USER chain at daemon start, before any session
      # create — deployment-internal ranges + metadata denied, internet OPEN.
      - ./sandbox/dind-egress-firewall.sh:/usr/local/bin/dind-egress-firewall.sh:ro
    # Program the inner-bridge egress firewall, then exec the stock rootless
    # entrypoint (rootlesskit + dockerd). The firewall backgrounds itself, waits
    # for dockerd to create DOCKER-USER, and installs the deny rules; the app
    # only dials the control API after the daemon is up, so the rules are in
    # place before the first session create succeeds.
    entrypoint:
      - sh
      - -c
      - |
        /usr/local/bin/dind-egress-firewall.sh &
        exec dockerd-entrypoint.sh "$@"
      - sh
    # Ready when the daemon answers over its TLS socket, using the client certs
    # it generated into /certs/client. Generous start_period covers first-boot
    # cert generation.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "docker --tlsverify --tlscacert /certs/client/ca.pem --tlscert /certs/client/cert.pem --tlskey /certs/client/key.pem -H tcp://127.0.0.1:2376 info >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

# The default datastore network, now declared EXPLICITLY so the sandbox control
# network can sit alongside it. Services with no `networks:` key still ride
# `default` (postgres/redis/metrics/minio/rabbitmq/redis-agents/db-migrate).
networks:
  default:
  # Server-side sandbox control path (§ sandbox-ctrl, README design F.19): ONLY
  # serve, backend, and sandbox-engine. Splits the engine control API off the
  # datastore network — the engine cannot address postgres/redis/minio, and a
  # session (an inner container of the daemon, never on any compose network)
  # reaches nothing of the deployment. NEVER place a datastore on this network.
  sandbox-ctrl:

volumes:
  tai-postgres-data:
  tai-redis-data:
  tai-prometheus:
  tai-prometheus-backend:
  tai-minio-data:
  tai-rabbitmq-data:
  tai-redis-agents-data:
  # Sandbox durable block store: the rootless-dind daemon's /var/lib/docker tree,
  # where PLAN_3's persistent tai-sbx-<workspace_key> inner volumes live — makes
  # durability="persistent" survive an engine recycle (the reciprocal dependency
  # stated on the sandbox-engine service).
  tai-sandbox-engine-data:
  # Sandbox-local persistent workspace root (direct/host mode), mounted into
  # serve+backend at SANDBOX_LOCAL_ROOT so persistent host workspaces survive a
  # container restart. Mutually exclusive with the engine store.
  tai-sandbox-local-data:
  # Shared mTLS client certs (cert.pem/key.pem/ca.pem) dind generates and
  # serve+backend consume RO at /certs/client. Not durable state — a rebuild
  # regenerates it.
  tai-sandbox-certs:
